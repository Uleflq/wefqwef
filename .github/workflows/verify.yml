name: Verify game

on: [push, pull_request]

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Check the committed playable build
        run: git diff --exit-code -- public/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: the-long-road
          path: public/index.html
          if-no-files-found: error
